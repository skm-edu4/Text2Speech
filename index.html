<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text2Speech</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 800px; width: 100%; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #bb86fc; margin-top: 0; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; color: #03dac6; }
        select, textarea, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2c2c2c; color: #fff; font-size: 16px; box-sizing: border-box; }
        textarea { height: 150px; resize: vertical; font-family: monospace; }
        button { background: #bb86fc; color: #000; border: none; cursor: pointer; font-weight: bold; margin-top: 20px; transition: 0.2s; }
        button:hover { background: #9955e8; }
        button:disabled { background: #555; color: #aaa; cursor: not-allowed; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #333; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; color: #888; font-weight: bold; }
        .tab.active { color: #bb86fc; border-bottom: 2px solid #bb86fc; margin-bottom: -2px; }
        .hidden { display: none; }
        #status { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; text-align: center; }
        .success { background: #004d40; color: #a7ffeb; }
        .error { background: #b71c1c; color: #ffcdd2; }
        audio { width: 100%; margin-top: 20px; }
        #batch-results { margin-top: 20px; max-height: 300px; overflow-y: auto; }
        .batch-item { padding: 10px; background: #2c2c2c; margin: 8px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .batch-item a { color: #03dac6; text-decoration: none; font-weight: bold; }
        .batch-item a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Text2Speech</h1>

        <label for="voice">Select Voice:</label>
        <select id="voice"><option>Loading voices...</option></select>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('single')">Single Text</div>
            <div class="tab" onclick="switchTab('batch')">Batch Processing</div>
        </div>

        <!-- Single Text Mode -->
        <div id="single-mode">
            <label for="text">Enter Text:</label>
            <textarea id="text" placeholder="Type something to speak..."></textarea>
            <button id="btn-single" onclick="synthesizeSingle()">Generate Audio</button>
            <audio id="audio-player" controls class="hidden"></audio>
        </div>

        <!-- Batch Mode -->
        <div id="batch-mode" class="hidden">
            <label for="batch-text">Enter Text (One sentence/paragraph per line):</label>
            <textarea id="batch-text" placeholder="Line 1&#10;Line 2&#10;Line 3"></textarea>
            <button id="btn-batch" onclick="synthesizeBatch()">Generate Batch</button>
            <div id="batch-results"></div>
        </div>

        <div id="status"></div</div>
    </div>

    <script>
        let currentVoice = "en-US-AriaNeural";

        // Load voices on startup with robust error handling
        fetch('/api/voices')
            .then(async res => {
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(`Server error: ${res.status} - ${err}`);
                }
                return res.json();
            })
            .then(data => {
                const select = document.getElementById('voice');
                select.innerHTML = '';
                if (!data.voices || data.voices.length === 0) {
                    const opt = document.createElement('option');
                    opt.textContent = "No voices available";
                    select.appendChild(opt);
                    return;
                }
                data.voices.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.name;
                    // Clean up the name for better display (e.g., "en-US-Aria (Female)")
                    opt.textContent = `${v.name.replace('Neural', '').replace('en-', '').replace('US-', '').replace('GB-', '')} (${v.gender})`;
                    if(v.name === currentVoice) opt.selected = true;
                    select.appendChild(opt);
                });
                select.onchange = (e) => currentVoice = e.target.value;
            })
            .catch(err => {
                console.error("Voice fetch error:", err);
                showStatus("Failed to load voices. Using defaults.", "error");
                // Hardcoded fallback in UI just in case
                const select = document.getElementById('voice');
                select.innerHTML = `
                    <option value="en-US-AriaNeural">US Aria (Female)</option>
                    <option value="en-US-GuyNeural">US Guy (Male)</option>
                    <option value="en-GB-SoniaNeural">GB Sonia (Female)</option>
                `;
            });

        function switchTab(mode) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab')[mode === 'single' ? 0 : 1].classList.add('active');
            document.getElementById('single-mode').classList.toggle('hidden', mode !== 'single');
            document.getElementById('batch-mode').classList.toggle('hidden', mode !== 'batch');
            document.getElementById('status').style.display = 'none';
        }

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = type;
            el.style.display = 'block';
        }

        async function synthesizeSingle() {
            const text = document.getElementById('text').value;
            if(!text) return showStatus("Please enter text.", "error");

            const btn = document.getElementById('btn-single');
            btn.disabled = true;
            btn.textContent = "Synthesizing...";
            showStatus("Generating audio, please wait...", "success");

            try {
                const res = await fetch('/api/synthesize', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ text, voice: currentVoice })
                });

                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.detail || "Unknown server error");
                }

                const data = await res.json();
                if(data.success) {
                    const player = document.getElementById('audio-player');
                    // Add timestamp to bypass browser audio caching
                    player.src = `/output/${data.file}?t=${new Date().getTime()}`;
                    player.classList.remove('hidden');
                    player.play();
                    showStatus(`Success! Saved as: ${data.file}`, "success");
                } else {
                    showStatus(data.detail || "Failed to generate", "error");
                }
            } catch(e) {
                console.error("Synthesis error:", e);
                showStatus(`Error: ${e.message}`, "error");
            }
            finally {
                // ALWAYS unlock the button, even if it fails
                btn.disabled = false;
                btn.textContent = "Generate Audio";
            }
        }

        async function synthesizeBatch() {
            const text_block = document.getElementById('batch-text').value;
            if(!text_block) return showStatus("Please enter text.", "error");

            const btn = document.getElementById('btn-batch');
            btn.disabled = true;
            btn.textContent = "Processing Batch...";
            showStatus("Processing batch, please wait...", "success");
            const resultsDiv = document.getElementById('batch-results');
            resultsDiv.innerHTML = '';

            try {
                const res = await fetch('/api/batch', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ text_block, voice: currentVoice })
                });

                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.detail || "Unknown server error");
                }

                const data = await res.json();
                if(data.success) {
                    data.files.forEach(file => {
                        const div = document.createElement('div');
                        div.className = 'batch-item';
                        div.innerHTML = `<span>🎵 ${file}</span> <a href="/output/${file}" download>⬇️ Download</a>`;
                        resultsDiv.appendChild(div);
                    });
                    showStatus(`Successfully generated ${data.files.length} files!`, "success");
                } else {
                    showStatus(data.detail || "Failed to generate batch", "error");
                }
            } catch(e) {
                console.error("Batch error:", e);
                showStatus(`Error: ${e.message}`, "error");
            }
            finally {
                btn.disabled = false;
                btn.textContent = "Generate Batch";
            }
        }
    </script>
</body>
</html>
